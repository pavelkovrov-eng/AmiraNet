name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and a newer push supersedes an in-flight one: the
# site should end up matching the latest commit, not whichever job finished
# last.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Deliberately gating the deploy on the suite rather than only on the
      # build. `npm run build` runs tsc, so it already catches type errors —
      # but the defects this project has actually shipped were behavioural
      # (a scheduler that silently stopped resurfacing words, content that
      # rendered invisible), and those are only caught here. A red suite
      # should leave the last good version live.
      - run: npm test

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
